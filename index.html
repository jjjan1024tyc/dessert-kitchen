<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="robots" content="noindex">
<title>甜點廚房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap">
<style>
/* Layout: one calm column, a fixed 4-step rail on every lesson, big touch targets for iPad/phone */
:root {
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --surface-2: #F6F8F6;
  --ink: #1D2A28;
  --muted: #5B6966;
  --line: #D5DDD8;
  --accent: #1E6B66;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDEA;
  --verb: #C2410C;
  --verb-bg: #FFE9DA;
  --ok: #2C7A35;
  --ok-bg: #E3F2E4;
  --hint: #7A5C00;
  --hint-bg: #FFF4CF;
  --gold: #A87A12;
  --shadow: 0 1px 2px rgba(20, 40, 36, .06), 0 4px 14px rgba(20, 40, 36, .06);
  --f-en: "Lexend", "Noto Sans TC", system-ui, sans-serif;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-fancy: "Fraunces", Georgia, "Noto Sans TC", serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A19; --surface: #1C2524; --surface-2: #222D2C; --ink: #E6EDEB; --muted: #A1AFAC; --line: #33413F;
    --accent: #5BBDB4; --accent-ink: #0E1716; --accent-soft: #1F3A37;
    --verb: #FF8F57; --verb-bg: #3B2417; --ok: #82CF87; --ok-bg: #1E3521; --hint: #EBCB6B; --hint-bg: #352C12; --gold: #E2B954;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A19; --surface: #1C2524; --surface-2: #222D2C; --ink: #E6EDEB; --muted: #A1AFAC; --line: #33413F;
  --accent: #5BBDB4; --accent-ink: #0E1716; --accent-soft: #1F3A37;
  --verb: #FF8F57; --verb-bg: #3B2417; --ok: #82CF87; --ok-bg: #1E3521; --hint: #EBCB6B; --hint-bg: #352C12; --gold: #E2B954;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-zh); font-size: 18px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 24px; font-weight: 700; letter-spacing: .02em; }
.brand span { font-family: var(--f-fancy); font-style: italic; color: var(--gold); font-size: 17px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 14px;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 16px; font-weight: 500;
}
.chip b { font-family: var(--f-en); font-variant-numeric: tabular-nums; }

/* cards & buttons */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.btn {
  min-height: 56px; padding: 12px 22px; border-radius: 14px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-size: 20px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn.big { min-height: 64px; font-size: 22px; width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 160px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }

/* step rail */
.rail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.dots i.done { background: var(--gold); border-color: var(--gold); }
.dots i.now { border-color: var(--accent); background: var(--accent-soft); }
.dots span { font-family: var(--f-en); font-size: 15px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

/* stamp card */
.stamps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .stamps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stamp {
  aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--line); background: transparent; padding: 0;
  display: flex; align-items: center; justify-content: center; font-family: var(--f-en); font-weight: 600; font-size: 17px; color: var(--muted); min-width: 0;
}
.stamp.got { border: 2px solid var(--gold); background: var(--surface); box-shadow: var(--shadow); padding: 4px; }
.stamp.got svg { width: 100%; height: auto; }
.stamp.next { border-color: var(--accent); color: var(--accent); }
.stamp { position: relative; }
.stamp .star {
  position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--gold); color: var(--surface); font-size: 13px; line-height: 22px; text-align: center; box-shadow: var(--shadow);
}
.plan-today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plan-today div { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.plan-today b { display: block; font-size: 22px; font-family: var(--f-en); }
.plan-today span { font-size: 15px; color: var(--muted); }
.tag { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.new { background: var(--verb-bg); color: var(--verb); }
.starline { color: var(--gold); font-weight: 700; font-size: 20px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.cell .stamp { width: 100%; cursor: pointer; }
.cell .stars { color: var(--gold); font-size: 11px; line-height: 1.2; min-height: 14px; letter-spacing: -.5px; white-space: nowrap; }
.cell .today { font-size: 11px; line-height: 1.25; font-weight: 700; color: var(--accent); text-align: center; min-height: 14px; }
.cell .today.new { color: var(--verb); }
.opt.find { align-items: flex-start; text-align: left; }
.opt.find .oe { font-size: 22px; }
.opt.found { border-color: var(--ok); background: var(--ok-bg); }
.opt.glow { border-color: var(--accent); background: var(--accent-soft); }
.gloss { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.gloss span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.gloss .ge { font-family: var(--f-en); font-size: 22px; font-weight: 600; }
.gloss .gz { font-size: 16px; color: var(--muted); }
.shelf-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 720px) { .shelf-list { grid-template-columns: 1fr 1fr; } }
.srow { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; min-width: 0; }
.srow.locked { background: transparent; box-shadow: none; border: 2px dashed var(--line); }
.sart { flex: none; width: 88px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 72px; }
.sart svg { width: 100%; height: auto; }
.sart .q { font-family: var(--f-en); font-size: 26px; font-weight: 700; color: var(--muted); }
.stext { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.sname { border: 0; background: none; padding: 0; font-size: 17px; font-weight: 700; text-align: left; }
.ssay { border: 0; background: var(--surface-2); border-radius: 10px; padding: 6px 10px; text-align: left; display: flex; flex-direction: column; gap: 0; }
.ssay .sen { font-family: var(--f-en); font-weight: 600; font-size: 18px; }
.ssay .szh { font-size: 15px; color: var(--muted); }
.ssay:active { background: var(--accent-soft); }
.why { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 10px 14px; font-size: 18px; font-weight: 500; text-align: center; }
.btn2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .choice { grid-template-columns: 1fr; } }
.choice .btn { flex-direction: column; gap: 0; min-height: 84px; }
.choice .btn small { font-size: 14px; font-weight: 500; opacity: .85; }
.rail div {
  border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 15px; font-weight: 500;
  background: var(--surface); border: 1.5px solid var(--line); color: var(--muted);
}
.rail div .n { display: block; font-family: var(--f-en); font-size: 13px; font-weight: 600; }
.rail div.now { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.rail div.done { color: var(--ok); border-color: transparent; background: var(--ok-bg); }
.rail div.skip { opacity: .5; border-style: dashed; }

/* video */
.vid { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 1280 / 744; max-width: 100%; }
.vid video { width: 100%; height: 100%; display: block; object-fit: cover; }
.vid .cover {
  position: absolute; inset: 0; border: 0; background: rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
}
.vid .cover svg { width: 72px; height: 72px; }
.vid.playing .cover { display: none; }
.listen {
  border: 2px dashed var(--line); border-radius: 14px; background: var(--surface-2);
  min-height: 150px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-size: 18px; font-weight: 500;
}
.listen svg { width: 64px; height: 64px; color: var(--accent); }
.listen.playing { border-color: var(--accent); background: var(--accent-soft); }

/* subtitles */
.subs { display: flex; flex-direction: column; gap: 6px; padding: 14px 8px 4px; text-align: center; }
.en { font-family: var(--f-en); font-weight: 600; font-size: clamp(28px, 6.4vw, 44px); line-height: 1.3; letter-spacing: .005em; }
.zh { font-family: var(--f-zh); font-size: clamp(22px, 4.6vw, 30px); font-weight: 500; color: var(--ink); }
.v { color: var(--verb); background: var(--verb-bg); border-radius: 8px; padding: 0 .18em; font-weight: 700; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.w { border: 0; background: none; padding: 0 .06em; border-radius: 8px; font: inherit; }
.w:active { background: var(--accent-soft); }
.meaning { min-height: 34px; text-align: center; font-size: 18px; color: var(--muted); }
.meaning b { font-family: var(--f-en); color: var(--ink); }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--muted); }
.note b { color: var(--ink); }

/* questions */
.ask { font-size: 21px; font-weight: 700; }
.opts { display: grid; gap: 12px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .opts.two { grid-template-columns: 1fr; } }
.opt {
  min-height: 72px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;
}
.opt .oe { font-family: var(--f-en); font-size: 24px; font-weight: 600; }
.opt .oz { font-size: 17px; color: var(--muted); }
.opt.sent .oe { font-size: 22px; }
.opt.yes { border-color: var(--ok); background: var(--ok-bg); }
.opt.no { opacity: .35; border-style: dashed; }
.fb { min-height: 30px; font-size: 18px; font-weight: 500; text-align: center; }
.fb.good { color: var(--ok); }
.fb.try { color: var(--hint); background: var(--hint-bg); border-radius: 10px; padding: 6px 10px; }
.qcount { font-family: var(--f-en); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* sentence builder */
.slots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 64px; padding: 10px; border-radius: 14px; background: var(--surface-2); border: 2px dashed var(--line); }
.slot { min-width: 54px; height: 48px; border-bottom: 3px solid var(--line); }
.tiles { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.tile {
  font-family: var(--f-en); font-size: 26px; font-weight: 600; min-height: 56px; padding: 6px 18px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
}
.placed { font-family: var(--f-en); font-size: 26px; font-weight: 600; min-height: 48px; padding: 4px 6px; display: inline-flex; align-items: center; }
.tile.used { visibility: hidden; }
.tile.shake { animation: shake .35s; }
.tile.glow { border-color: var(--accent); background: var(--accent-soft); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* home */
.today { display: grid; grid-template-columns: 1fr; gap: 14px; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plan li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.plan .k { font-family: var(--f-en); font-weight: 700; color: var(--accent); width: 22px; text-align: center; }
.plan .t { margin-left: auto; font-size: 15px; color: var(--muted); font-family: var(--f-en); }
.mystery { display: flex; align-items: center; gap: 14px; }
.mystery .box { width: 72px; height: 72px; flex: none; border-radius: 16px; border: 2px dashed var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--f-en); font-size: 30px; color: var(--gold); font-weight: 700; }

/* collection */
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.dess {
  border: 0; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); padding: 10px 6px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0;
}
.dess svg { width: 100%; max-width: 120px; height: auto; }
.dess .dn { font-size: 15px; font-weight: 700; line-height: 1.3; text-align: center; }
.dess.locked { background: transparent; box-shadow: none; border: 2px dashed var(--line); color: var(--muted); justify-content: center; min-height: 140px; cursor: default; }
.dess.locked .q { font-family: var(--f-en); font-size: 28px; font-weight: 700; }
.dess.locked .dn { font-weight: 400; }

/* dessert detail */
.reveal { align-items: center; text-align: center; }
.reveal svg { width: min(260px, 70%); height: auto; }
.reveal.pop svg { animation: pop .7s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.dname { font-size: 30px; font-weight: 700; }
.dname-en { font-family: var(--f-fancy); font-style: italic; font-size: 22px; color: var(--gold); }
.facts { display: grid; gap: 8px; text-align: left; width: 100%; }
.facts div { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: 17px; }
.facts b { color: var(--muted); font-weight: 500; margin-right: 8px; }
.overlay {
  position: fixed; inset: 0; background: rgba(10, 20, 18, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.overlay .card { width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; }
@media (min-width: 700px) { .overlay { align-items: center; } }

/* review list & parent */
.list { display: grid; gap: 10px; }
.list button { text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; min-height: 56px; display: flex; gap: 12px; align-items: center; }
.list .num { font-family: var(--f-en); color: var(--muted); font-variant-numeric: tabular-nums; width: 26px; flex: none; }
.list .ls { font-family: var(--f-en); font-size: 20px; font-weight: 600; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
input[type=text], input[type=number] { font: inherit; font-size: 20px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 120px; }
.foot { text-align: center; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; min-height: 44px; padding: 8px 12px; }

@media (prefers-reduced-motion: reduce) {
  .reveal.pop svg, .tile.shake { animation: none; }
}
</style>
</head>

<script>
/* ---------- 設定 ---------- */
// 完成當天課程時要通知的網址（Google Apps Script 網頁應用程式的網址，結尾是 /exec）。留空 = 不寄信。
const REPORT_URL = "https://script.google.com/macros/s/AKfycbxIkEk6UksswgOPjjgRXOhOHOYI11tpdmt8Mfqhcgam83RuuKJNT9_W0JJdBrnni_CFCg/exec";
// 要和 Apps Script 裡的 TOKEN 一模一樣
const REPORT_TOKEN = "dessert-kitchen-2026";

/* ---------- 句子 ---------- */
// v 動詞, o 受詞, zh 中文, zv 中文動詞（標色）, om 受詞每個字的中文
const S = [
  { v: "chopping", o: "onions", zh: "我正在切碎洋蔥。", zv: "切碎", om: ["洋蔥"] },
  { v: "frying", o: "eggs", zh: "我正在煎蛋。", zv: "煎", om: ["蛋"] },
  { v: "flipping", o: "pancakes", zh: "我正在翻鬆餅。", zv: "翻", om: ["鬆餅"] },
  { v: "roasting", o: "chicken", zh: "我正在烤雞。", zv: "烤", om: ["雞"] },
  { v: "kneading", o: "dough", zh: "我正在揉麵團。", zv: "揉", om: ["麵團"] },
  { v: "squeezing", o: "a lemon", zh: "我正在擠檸檬。", zv: "擠", om: ["一顆", "檸檬"] },
  { v: "slicing", o: "bread", zh: "我正在把麵包切片。", zv: "切片", om: ["麵包"] },
  { v: "mashing", o: "potatoes", zh: "我正在把馬鈴薯搗成泥。", zv: "搗成泥", om: ["馬鈴薯"] },
  { v: "cracking", o: "eggs", zh: "我正在敲開蛋。", zv: "敲開", om: ["蛋"] },
  { v: "scaling", o: "fish", zh: "我正在刮魚鱗。", zv: "刮魚鱗", om: ["魚"] },
  { v: "carving", o: "turkey", zh: "我正在分切火雞。", zv: "分切", om: ["火雞"] },
  { v: "whisking", o: "eggs", zh: "我正在攪打蛋液。", zv: "攪打", om: ["蛋"] },
  { v: "dicing", o: "apple", zh: "我正在把蘋果切丁。", zv: "切丁", om: ["蘋果"] },
  { v: "zesting", o: "lemons", zh: "我正在刨檸檬皮。", zv: "刨", om: ["檸檬"] },

const KEY = "dessert-kitchen-v1";
const MAX_STARS = 6;
// info[n]: learned 學會日期, reviews 複習總次數, stars 星星（一天最多一顆，學會當天不算）, starDay 最後加星的日期, lastReview 最後複習日期
function fresh() { return { learned: [], info: {}, log: [], outbox: [] }; }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (!s) return null;
    const n = fresh();
    if (Array.isArray(s.learned)) n.learned = s.learned;
    else if (typeof s.next === "number") n.learned = [...Array(s.next).keys()];
    else return null;
    n.outbox = s.outbox || [];
    n.log = (s.log || []).filter((e) => e.n && e.kind);
    n.learned.forEach((k) => {
      const o = (s.info || {})[k] || {};
      n.info[k] = typeof o.reviews === "number" ? o
        : { learned: o.learned || "2000-01-01", reviews: o.perfect || 0, stars: Math.min(o.perfect || 0, MAX_STARS), starDay: "", lastReview: "" };
    });
    return n;
  } catch (e) {}
  return null;
}
let st = load() || fresh();
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function speak(w) {
  try {
    const u = new SpeechSynthesisUtterance(w); u.lang = "en-US"; u.rate = 0.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
// 先念完再執行 cb；念不出來或 onend 沒觸發時，用計時器保底
function speakThen(w, cb) {
  let done = false;
  const fin = () => { if (!done) { done = true; cb(); } };
  setTimeout(fin, Math.max(900, w.length * 110));
  try {
    const u = new SpeechSynthesisUtterance(w); u.lang = "en-US"; u.rate = 0.8;
    u.onend = fin; u.onerror = fin;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { fin(); }
}
// 單獨念 "I" 時，語音會念成 "capital I"，改成照發音念
const spoken = (w) => w === "I" ? "eye" : w;
// 排隊念：不打斷前一個字，點很快也會一個一個念完；cb 在這一句念完後執行
let queueEnd = 0;
function sayQueued(w, cb) {
  const now = Date.now();
  queueEnd = Math.max(now, queueEnd) + Math.max(700, w.length * 110);
  let done = false;
  const fin = () => { if (!done) { done = true; cb && cb(); } };
  setTimeout(fin, queueEnd - now + 400);
  try {
    const u = new SpeechSynthesisUtterance(w); u.lang = "en-US"; u.rate = 0.8;
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
  } catch (e) { fin(); }
}

function wireVideo(onWatched) {
  const v = $("video"); if (!v) return;
  curVideo = v;
  const box = v.closest(".vid");
  const play = () => {
    try { v.pause(); v.currentTime = 0; } catch (e) {}
    const p = v.play(); if (p && p.catch) p.catch(() => {});
  };
  v.addEventListener("playing", () => box.classList.add("playing"));
  v.addEventListener("pause", () => box.classList.remove("playing"));
  v.addEventListener("ended", () => { box.classList.remove("playing"); if (onWatched) onWatched(); });
  v.addEventListener("error", () => onWatched && onWatched());
  if (onWatched) setTimeout(() => { if (curVideo === v && v.readyState === 0) onWatched(); }, 15000);
  $(".cover").onclick = play;
  v.onclick = play;
}
function stopVideo() { try { curVideo && curVideo.pause(); } catch (e) {} curVideo = null; }

      <p class="small">按<b>數字格子</b>：學新句子。按<b>點心</b>：看介紹、複習。${left === 0 ? "24 句都學會了，可以繼續複習集星星！" : ""}</p>
      <div class="stamps">${[...Array(24).keys()].map(cellHTML).join("")}</div>
      <p class="muted small">每一句都是：看影片 → 選選看 → 排句子 → 找錯句。學會新句子得到一個點心；在不同的日子複習，每天可以加一顆 ★，最多 ${MAX_STARS} 顆。</p>
    </div>
    <div class="foot row" style="justify-content:center"><button class="linkish" id="toParent">家長區</button></div>`;
  $("#toShelf").onclick = shelf;
  $$(".stamp[data-n]").forEach((b) => b.onclick = () => {
    const n = +b.dataset.n;
    if (isLearned(n)) showDessert(n); else startItem(n, "new");
  });
  $("#toParent").onclick = parentGate;
  window.scrollTo(0, 0);
}

/* ---------- 一句的流程（新句子和複習一樣）：看影片 → 選選看 → 排句子 → 找錯句 ---------- */
const STEP_NAMES = ["看影片", "選選看", "排句子", "找錯句"];
let L = null;
function startItem(n, kind) {
  L = { n, kind, step: 0, qi: 0, qs: [], mistakes: 0, start: Date.now() };
  runStep();
}
function lessonShell(body) {
  const rail = STEP_NAMES.map((nm, i) => {
    const c = i < L.step ? "done" : i === L.step ? "now" : "";
    return `<div class="${c}"><span class="n">${i < L.step ? "✓" : i + 1}</span>${nm}</div>`;
  }).join("");
  const tag = L.kind === "new" ? `<span class="tag new">新句子</span>` : `<span class="tag">複習</span>`;
  app.innerHTML = `<div class="top"><div class="brand"><h1>第 ${L.n + 1} 句</h1>${tag}</div>
    <button class="chip" id="rest">休息一下</button></div>
    <div class="rail" style="grid-template-columns:repeat(4,1fr)">${rail}</div>${body}`;
  $("#rest").onclick = home;
  window.scrollTo(0, 0);
}
function pickOthers(n, k) {
  const known = shuffle(st.learned.filter((i) => i !== n));
  const rest = shuffle([...Array(24).keys()].filter((i) => i !== n && !known.includes(i)));
  return [...known, ...rest].slice(0, k);
}
function runStep() {
  stopVideo();
  [watch, quiz, build, findWrong, itemDone][L.step]();
}
function nextStep() { L.step++; runStep(); }

function watch() {
  const n = L.n;
  lessonShell(`<div class="card">
    <p class="ask">請播放影片</p>
    ${videoHTML(n)}
    <div class="subs"><p class="en">${enHTML(n, true)}</p><p class="zh">${zhHTML(n)}</p></div>
    <p class="meaning" id="mean">按一下英文單字，可以聽發音、看意思</p>
    <div class="note"><b>I am ＋ 動詞-ing</b> ＝ 我正在做某件事。${TIPS[n] ? "<br>" + TIPS[n] : ""}</div>
    <p class="muted small" id="wait">按影片中間的播放鍵，看完一次就會出現下一步。</p>
    <button class="btn big" id="go" hidden>下一步：選選看</button>
  </div>`);
  wireVideo(() => { const g = $("#go"); if (g && g.hidden) { g.hidden = false; $("#wait").hidden = true; } });
  wireWords(n);
  $("#go").onclick = nextStep;
}

function quiz() {
  const n = L.n;
  L.qi = 0;
  // 固定順序：先句子題，再單字題
  L.qs = [
    { type: "zh", n, opts: shuffle([n, ...pickOthers(n, 1)]) },
    { type: "vid", n, opts: shuffle([n, ...pickOthers(n, 1)]) },
  ];
  question();
}
function question() {
  const q = L.qs[L.qi];
  const total = L.qs.length;
  const say = q.type === "vid" ? S[q.n].v : enOf(q.n);
  const prompt = q.type === "vid" ? "聽單字，選出你聽到的那個字" : "聽句子，選出你聽到的那一句";
  const media = q.type === "zh" ? `<div class="subs"><p class="zh">${zhHTML(q.n)}</p></div>` : "";
  const opt = (k) => q.type === "vid"
    ? `<button class="opt" data-k="${k}"><span class="oe">${S[k].v}</span><span class="oz">${S[k].zv}</span></button>`
    : `<button class="opt sent" data-k="${k}"><span class="oe">${enHTML(k)}</span></button>`;
  lessonShell(`<div class="card">
    <div class="row" style="justify-content:space-between"><p class="ask">${prompt}</p><span class="qcount">${L.qi + 1} / ${total}</span></div>
    ${media}
    <div class="row"><button class="btn ghost" id="again">再聽一次</button></div>
    <div class="opts two">${q.opts.map(opt).join("")}</div>
    <p class="fb" id="fb"></p>
    <button class="btn big" id="next" hidden>${L.qi + 1 < total ? "下一題" : "下一步：排句子"}</button>
  </div>`);
  wireVideo();
  let busy = true;
  // 一進畫面先念，念完才能選
  speakThen(say, () => { busy = false; });
  $("#again").onclick = () => { if (!busy) { busy = true; speakThen(say, () => { busy = false; }); } };
  $$(".opt").forEach((b) => b.onclick = () => {
    if (busy || b.classList.contains("no") || !$("#next").hidden) return;
    const k = +b.dataset.k;
    busy = true;
    b.classList.add("glow");
    speakThen(q.type === "vid" ? S[k].v : enOf(k), () => {
      busy = false;
      b.classList.remove("glow");
      const fb = $("#fb");
      if (k === q.n) {
        b.classList.add("yes");
        fb.className = "fb good"; fb.textContent = "答對了！";
        $("#next").hidden = false; $("#next").focus();
      } else {
        L.mistakes++;
        b.classList.add("no");
        fb.className = "fb try";
        fb.textContent = q.type === "zh" ? "沒關係，看看橘色的字，再選一次。" : "沒關係，按「再聽一次」，再選一次。";
      }
    });
  });
  $("#next").onclick = () => {
    L.qi++;
    if (L.qi < L.qs.length) question(); else nextStep();
  };
}

function build() {
  const n = L.n;
  const words = wordsOf(n);
  let order = shuffle(words.map((_, i) => i));
  if (order.every((v, i) => v === i)) order = order.reverse();
  let placed = 0;
  lessonShell(`<div class="card">
    <p class="ask">照順序按字卡，排出句子</p>
    ${videoHTML(n)}
    <div class="slots" id="slots">${words.map(() => `<span class="slot"></span>`).join("")}</div>
    <div class="tiles">${order.map((i) => `<button class="tile" data-i="${i}">${words[i]}</button>`).join("")}</div>
    <p class="fb" id="fb"></p>
    <div class="row"><button class="btn ghost" id="hint">給我提示</button></div>
    <button class="btn big" id="next" hidden>下一步：找錯句</button>
  </div>`);
  wireVideo();
  const fb = $("#fb");
  try { speechSynthesis.cancel(); } catch (e) {}
  queueEnd = 0;
  // 按對：字卡立刻移上去，並排隊念出；按錯：不移、不念，輕輕晃一下
  $$(".tile").forEach((b) => b.onclick = () => {
    const i = +b.dataset.i;
    if (placed >= words.length || b.classList.contains("used")) return;
    if (words[i] === words[placed]) {
      $(".slot").outerHTML = `<span class="placed">${i === 2 ? `<span class="v">${words[i]}</span>` : words[i]}${placed === words.length - 1 ? "." : ""}</span>`;
      b.classList.add("used"); $$(".tile").forEach((t) => t.classList.remove("glow"));
      placed++;
      fb.className = "fb"; fb.textContent = "";
      sayQueued(spoken(words[i]));
      if (placed === words.length) {
        $(".tiles").hidden = true; $("#hint").hidden = true;
        fb.className = "fb good"; fb.textContent = "全部排對了！";
        sayQueued(enOf(n), () => { const nx = $("#next"); if (nx) nx.hidden = false; });
      }
    } else {
      L.mistakes++;
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      fb.className = "fb try"; fb.textContent = "不是這個字。可以播影片聽聽看，或按「給我提示」。";
    }
  });
  $("#hint").onclick = () => {
    const t = $$(".tile").find((t) => !t.classList.contains("used") && words[+t.dataset.i] === words[placed]);
    if (t) t.classList.add("glow");
  };
  $("#next").onclick = nextStep;
}

// 找錯句：選錯不計入選錯次數
function findWrong() {
  const [a, b, bad, why] = F[L.n];
  const opts = shuffle([{ s: a, bad: false }, { s: b, bad: false }, { s: bad, bad: true }]);
  lessonShell(`<div class="card">
    <p class="ask">找錯句：哪一句是錯的？</p>
    <p class="muted">三件事裡，有一件做不到。</p>
    <div class="opts">${opts.map((o, i) => `<button class="opt find" data-i="${i}">${glossHTML(o.s)}</button>`).join("")}</div>
    <p class="fb" id="fb"></p>
    <p class="why" id="why" hidden></p>
    <button class="btn big" id="next" hidden>完成這一句</button>
  </div>`);
  $$(".opt").forEach((btn) => btn.onclick = () => {
    if (btn.classList.contains("no") || !$("#next").hidden) return;
    const o = opts[+btn.dataset.i];
    const fb = $("#fb");
    if (o.bad) {
      btn.classList.add("found");
      fb.className = "fb good"; fb.textContent = "對！這句是錯句。";
      $("#why").textContent = why; $("#why").hidden = false;
      speak(fEn(o.s));
      $("#next").hidden = false; $("#next").focus();
    } else {
      btn.classList.add("no");
      fb.className = "fb try"; fb.textContent = "這句是對的，這件事做得到。再看看另外兩句。";
      speak(fEn(o.s));
    }
  });
  $("#next").onclick = nextStep;
}

function itemDone() {
  const { n, kind } = L;
  const t = today();
  const secs = Math.round((Date.now() - L.start) / 1000);
  stopVideo();
  if (kind === "new" && !isLearned(n)) {
    st.learned.push(n);
    st.info[n] = { learned: t, reviews: 0, stars: 0, starDay: "", lastReview: "" };
    st.log.push({ kind: "new", n: n + 1, date: t, secs, mistakes: L.mistakes });
    save();
    sendReport("new", n, secs, L.mistakes, false);
    L = null;
    app.innerHTML = dessertCard(n, "pop");
    $("#ok").onclick = home;
    window.scrollTo(0, 0);
    return;
  }
  const I = st.info[n];
  I.reviews++;
  I.lastReview = t;
  let star = false;
  if (I.learned !== t && I.starDay !== t) { I.stars++; I.starDay = t; star = I.stars <= MAX_STARS; }
  st.log.push({ kind: "rev", n: n + 1, date: t, secs, mistakes: L.mistakes });
  save();
  sendReport("review", n, secs, L.mistakes, star);
  L = null;
  const why = I.learned === t ? "今天剛學會的句子，明天再複習才會加星星。" : !star && I.starDay === t && I.stars <= MAX_STARS ? "今天已經加過星星了，明天再複習可以再加一顆。" : "";
  app.innerHTML = `<div class="card reveal ${star ? "pop" : ""}">
    <p class="muted">複習完成</p>
    ${ART[n]}
    <div class="subs"><p class="en">${enHTML(n)}</p><p class="zh">${zhHTML(n)}</p></div>
    ${star ? `<p class="starline">得到一顆星星！</p>` : ""}
    <p class="starline">${starStr(starsOf(n)) || "（還沒有星星）"}</p>
    <p class="muted">這句已經複習 ${I.reviews} 次。${why}</p>
    <button class="btn big" id="ok">回集點卡</button>
  </div>`;
  $("#ok").onclick = home;
  window.scrollTo(0, 0);
}

/* ---------- 點心 ---------- */
function dessertCard(i, mode) {
  const d = D[i];
  const pop = mode === "pop";
  const I = st.info[i];
  return `<div class="card reveal ${pop ? "pop" : ""}">
    ${pop ? `<p class="muted">集點卡蓋了第 ${i + 1} 格，你得到：</p>` : ""}
    ${ART[i]}
    <div><p class="dname">${d.name}</p><p class="dname-en">${d.en}</p></div>
    <div class="facts"><div><b>來自</b>${d.from}</div><div><b>小知識</b>${d.fact}</div><div><b>學到的句子</b><span style="font-family:var(--f-en);font-weight:600">${enHTML(i)}</span></div>
    ${!pop && I ? `<div><b>複習</b>${I.reviews} 次　<span class="starline" style="font-size:17px">${starStr(starsOf(i))}</span></div>` : ""}</div>
    ${pop ? `<button class="btn big" id="ok">回集點卡</button>` : `<div class="btn2"><button class="btn ghost" id="ok">關閉</button><button class="btn" id="rev">複習</button></div>`}
  </div>`;
}
function showDessert(i) {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = dessertCard(i, "view");
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector("#ok").onclick = close;
  ov.querySelector("#rev").onclick = () => { close(); startItem(i, "rev"); };
  ov.onclick = (e) => { if (e.target === ov) close(); };
}
function shelf() {
  stopVideo();
  L = null;
  app.innerHTML = `<div class="top"><div class="brand"><h1>我的點心櫃</h1><span>${st.learned.length} / 24　★ ${totalStars()}</span></div>
    <button class="chip" id="back">回首頁</button></div>
    <p class="muted small">按英文句子可以聽朗讀；按點心可以看介紹、複習。</p>
    <div class="shelf-list">${D.map((d, i) => isLearned(i)
      ? `<div class="srow"><button class="sart" data-i="${i}" aria-label="${d.name}">${ART[i]}</button>
          <div class="stext"><button class="sname" data-i="${i}">${d.name}</button>
          <button class="ssay" data-n="${i}"><span class="sen">${enHTML(i)}</span><span class="szh">${S[i].zh}</span></button>
          <span class="starline" style="font-size:15px">${starStr(starsOf(i))}</span></div></div>`
      : `<div class="srow locked"><div class="sart"><span class="q">?</span></div><div class="stext"><span class="muted">第 ${i + 1} 句</span></div></div>`).join("")}</div>`;
  $("#back").onclick = home;
  $$(".sart[data-i], .sname").forEach((b) => b.onclick = () => showDessert(+b.dataset.i));
  $$(".ssay").forEach((b) => b.onclick = () => speak(enOf(+b.dataset.n)));
  window.scrollTo(0, 0);
}

/* ---------- 寄信通知：新句和複習每一句都寄 ---------- */
function sendReport(kind, n, secs, mistakes, star) {
  if (!REPORT_URL) return;
  const I = st.info[n];
  st.outbox = st.outbox || [];
  st.outbox.push({
    token: REPORT_TOKEN, kind, date: today(), n: n + 1, sentence: enOf(n), zh: S[n].zh,
    dessert: D[n].name, dessertEn: D[n].en, minutes: Math.round(secs / 6) / 10, mistakes,
    reviews: I.reviews, stars: starsOf(n), newStar: star, collected: st.learned.length, totalStars: totalStars(),
  });
  save();
  flushReports();
}
// 沒有網路時先存起來，下次打開網頁再寄
let flushing = false;
async function flushReports() {
  if (!REPORT_URL || flushing || !st.outbox || !st.outbox.length) return;
  flushing = true;
  while (st.outbox.length) {
    try {
      await postReport(st.outbox[0]);
      st.outbox.shift(); save();
    } catch (e) { break; }
  }
  flushing = false;
}
function postReport(body) {
  // Apps Script 不回傳 CORS 標頭，所以用 no-cors；只有網路失敗時才會進到 catch
  return fetch(REPORT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
}
window.addEventListener("online", flushReports);

/* ---------- 家長區 ---------- */
function parentGate() {
  stopVideo();
  app.innerHTML = `<div class="top"><div class="brand"><h1>家長區</h1></div><button class="chip" id="back">回首頁</button></div>
    <div class="card"><p>請家長回答：<b style="font-family:var(--f-en)">6 × 7 − 5 =</b></p>
    <div class="row"><input id="ans" type="number" inputmode="numeric" aria-label="答案"><button class="btn" id="enter">進入</button></div><p class="fb" id="fb"></p></div>`;
  $("#back").onclick = home;
  $("#enter").onclick = () => { if ($("#ans").value.trim() === "37") parent(); else { $("#fb").className = "fb try"; $("#fb").textContent = "答案不對。"; } };
}
function parent(confirmReset = false) {
  const rows = st.log.slice().reverse().map((e) => `<tr><td>${e.date}</td><td>${e.kind === "rev" ? "複習" : "新句"}</td><td>第 ${e.n} 句 ${S[e.n - 1].v}</td><td>${Math.max(1, Math.round(e.secs / 60))} 分</td><td>${e.mistakes}</td></tr>`).join("");
  app.innerHTML = `<div class="top"><div class="brand"><h1>家長區</h1></div><button class="chip" id="back">回首頁</button></div>
    <div class="card"><h3>學習紀錄</h3>
      <p class="muted small">已學會 ${st.learned.length} / 24 句，星星共 ${totalStars()} 顆。紀錄只存在這台裝置上。選錯次數包含選選看和排句子，不含找錯句。</p>
      <div class="tbl"><table><thead><tr><th>日期</th><th>類型</th><th>句子</th><th>時間</th><th>選錯</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="muted">還沒有紀錄</td></tr>`}</tbody></table></div>
    </div>
    <div class="card"><h3>完成通知</h3>
      <p class="small">${REPORT_URL ? `每完成一句（新句或複習），會自動通知 ${REPORT_TO}。` : `尚未設定寄信網址，目前不會寄出通知。`}</p>
      ${st.outbox && st.outbox.length ? `<p class="small muted">有 ${st.outbox.length} 封通知等網路恢復後寄出。</p>` : ""}
      ${REPORT_URL ? `<div class="row"><button class="btn ghost" id="testMail">寄一封測試信</button></div><p class="fb" id="mailFb"></p>` : ""}</div>
    <div class="card"><h3>重設</h3>
      <div class="row"><button class="btn ghost" id="reset">${confirmReset ? "再按一次，確定清除全部進度" : "清除全部進度"}</button></div></div>`;
  $("#back").onclick = home;
  const tm = $("#testMail");
  if (tm) tm.onclick = () => {
    tm.disabled = true;
    postReport({ token: REPORT_TOKEN, kind: "test", date: today(), collected: st.learned.length })
      .then(() => { $("#mailFb").className = "fb good"; $("#mailFb").textContent = `已送出，請到 ${REPORT_TO} 收信（可能要等 1 分鐘）。`; })
      .catch(() => { $("#mailFb").className = "fb try"; $("#mailFb").textContent = "送不出去，請確認 iPad 有連上網路。"; tm.disabled = false; });
  };
  $("#reset").onclick = () => {
    if (!confirmReset) return parent(true);
    st = fresh(); save(); home();
  };
}

home();
flushReports();
</script>
</body>
